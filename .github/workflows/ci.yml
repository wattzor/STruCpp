name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Guard std::common_type_t in comparison/selection overloads
        run: |
          if grep -n 'std::common_type_t' src/runtime/include/iec_var.hpp src/runtime/include/iec_std_lib.hpp; then
            echo 'std::common_type_t is not allowed inside IEC comparison/selection helpers (it resolves signed/unsigned pairs to unsigned).'
            exit 1
          fi

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 22 minimum: the codesys-importer's browser-safe unzip
        # path uses `DecompressionStream("deflate-raw")`, whose
        # `deflate-raw` format string is only accepted from Node 21.2+.
        # Drop 18 / 20 entirely; 22 is current LTS.
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify g++ and cc are present
        run: |
          command -v g++ || (echo "g++ not found" && exit 1)
          command -v cc || (echo "cc not found" && exit 1)
          g++ --version
          cc --version

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:coverage -- --run --reporter=default --reporter=json --outputFile=./vitest-results.json

      - name: Verify no unexpected test skips
        run: node -e "
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('./vitest-results.json', 'utf8'));
          if ((data.numFailedTests || 0) > 0) {
            console.error(data.numFailedTests + ' tests failed');
            process.exit(1);
          }
          const assertions = (data.testResults || []).flatMap(s => s.assertionResults || []);
          const skipped = assertions.filter(r => r.status === 'skipped' || r.status === 'pending' || r.status === 'todo');
          if (skipped.length > 0) {
            console.error(skipped.length + ' tests were skipped/pending/todo unexpectedly');
            for (const r of skipped.slice(0, 20)) console.error('  - ' + r.fullName);
            process.exit(1);
          }
          console.log('All ' + data.numPassedTests + ' tests executed (0 skipped, 0 failed)');
        "

  test-32bit-target:
    name: CODESYS Semantics (32-bit target width)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    env:
      STRUCPP_TARGET_WIDTH: "32"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run CODESYS semantics tests under 32-bit target width
        run: npx vitest run tests/integration/codesys-semantics.test.ts tests/integration/codesys-semantics-assumed.test.ts tests/integration/codesys-semantics-target.test.ts

  extension:
    name: Extension Build & Test
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install compiler dependencies and build
        run: npm ci && npm run build

      - name: Install extension dependencies
        run: cd vscode-extension && npm ci

      - name: Run extension unit tests
        run: cd vscode-extension && npx vitest run

      - name: Verify extension bundle
        run: cd vscode-extension && npm run bundle

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  binary-smoke:
    # Build the standalone binary the way `release.yml` does and actually run
    # it. Catches the issue #132 class of bug (binary ships a different
    # Node/ICU build than dev/CI and crashes at startup) on every PR, instead
    # of only discovering it after a release. One target is enough here; the
    # full 5-target + Windows matrix runs in release.yml.
    name: Binary Smoke Test
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Bundle
        run: npm run build:bundle

      - name: Build standalone binary
        run: npx pkg dist/strucpp-bundle.cjs --no-bytecode --public-packages "*" --public --target node22-linux-x64 --output dist/bin/strucpp --compress GZip

      - name: Smoke-test binary
        run: node scripts/smoke-test.mjs dist/bin/strucpp
